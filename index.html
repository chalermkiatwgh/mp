<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงทะเบียนผู้เช่าใหม่</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://tailwindcss.com"></script>
  <!-- SweetAlert2 CDN สำหรับหน้าต่างแจ้งเตือน -->
  <script src="https://jsdelivr.net"></script>
  <style>
    @import url('https://googleapis.com');
    
    body { 
      font-family: 'Sarabun', sans-serif; 
      background-color: #EEF4F8; /* สีพื้นหลังหลักรอบนอกตามต้นฉบับ */
    }

    /* รักษารูปแบบและขนาดกล่องข้อความเดิมไว้ทั้งหมด */
    .custom-input {
      background-color: #FFFFFF;
      border: 1px solid #E4EBEF;
      border-radius: 14px;
      color: #333333;
      font-size: 15px;
      font-weight: 400;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.01);
    }
    .custom-input::placeholder {
      color: #B4BCC2;
    }
    .custom-input:focus {
      outline: none;
      border-color: #00738C;
      box-shadow: 0 0 0 3px rgba(0, 115, 140, 0.08);
    }

    /* รักษาตำแหน่ง สี ขนาด และมิติเงาของปุ่มตามภาพต้นฉบับอย่างสมบูรณ์ */
    .btn-primary {
      background-color: #00738C;
      color: #FFFFFF;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(0, 115, 140, 0.25);
    }
    .btn-primary:hover {
      background-color: #005D72;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- แผ่นการ์ดพื้นหลังสีขาวทรงสูง ขนาดและตำแหน่งเดิมตามภาพ -->
  <div class="w-full max-w-[390px] bg-white rounded-[36px] shadow-[0_12px_40px_rgba(150,175,190,0.12)] px-7 py-9 space-y-6">
    
    <!-- [ ส่วนหัวข้อ - Header ] -->
    <div class="text-center space-y-3 pt-2">
      <div class="flex justify-center mb-1">
        <svg xmlns="http://w3.org" viewBox="0 0 48 48" class="w-16 h-16">
          <path fill="#93BCE6" d="M34 42H14V14h20v28z"/>
          <path fill="#6094CE" d="M26 6h-4v8h4V6z"/>
          <path fill="#76A8DC" d="M29 14H19V6h10v8z"/>
          <path fill="#6094CE" d="M14 14h20v4H14v-4z"/>
          <path fill="#FFFFFF" opacity="0.8" d="M17 20h3v3h-3v-3zm5 0h3v3h-3v-3zm5 0h3v3h-3v-3zm-10 5h3v3h-3v-3zm5 0h3v3h-3v-3zm5 0h3v3h-3v-3zm-10 5h3v3h-3v-3zm5 0h3v3h-3v-3zm5 0h3v3h-3v-3zm-10 5h3v3h-3v-3zm5 0h3v3h-3v-3zm5 0h3v3h-3v-3z"/>
        </svg>
      </div>
      <h2 class="text-[21px] font-bold text-[#1C2834] tracking-normal">ลงทะเบียนผู้เช่าใหม่</h2>
    </div>

    <!-- [ ส่วนกรอกข้อมูล - Form Fields ] -->
    <form id="registrationForm" onsubmit="handleFormSubmit(event)" class="space-y-[16px]">
      
      <!-- เลขห้อง -->
      <div class="flex flex-col space-y-1.5">
        <label for="roomNumber" class="text-[14px] font-medium text-[#2C3E50]">เลขห้อง</label>
        <input type="text" id="roomNumber" name="roomNumber" required
          class="custom-input w-full px-4 py-[12px] transition-all"
          placeholder="เช่น 101">
      </div>

      <!-- ชื่อ -->
      <div class="flex flex-col space-y-1.5">
        <label for="firstName" class="text-[14px] font-medium text-[#2C3E50]">ชื่อ</label>
        <input type="text" id="firstName" name="firstName" required
          class="custom-input w-full px-4 py-[12px] transition-all"
          placeholder="กรอกชื่อจริง">
      </div>

      <!-- นามสกุล -->
      <div class="flex flex-col space-y-1.5">
        <label for="lastName" class="text-[14px] font-medium text-[#2C3E50]">นามสกุล</label>
        <input type="text" id="lastName" name="lastName" required
          class="custom-input w-full px-4 py-[12px] transition-all"
          placeholder="กรอกนามสกุล">
      </div>

      <!-- เบอร์โทรศัพท์มือถือ -->
      <div class="flex flex-col space-y-1.5">
        <label for="phoneNumber" class="text-[14px] font-medium text-[#2C3E50]">เบอร์โทรศัพท์มือถือ</label>
        <input type="tel" id="phoneNumber" name="phoneNumber" required pattern="[0-9]*" inputmode="numeric"
          oninput="this.value = this.value.replace(/[^0-9]/g, '')"
          class="custom-input w-full px-4 py-[12px] transition-all"
          placeholder="กรอกเบอร์มือถือ 10 หลัก">
      </div>

      <!-- [ ส่วนปุ่มกด - Action Button ] -->
      <div class="pt-5 pb-2">
        <button type="submit" id="submitBtn"
          class="btn-primary w-full font-bold py-3.5 text-[16px] transition-all flex items-center justify-center space-x-2">
          <span>บันทึกข้อมูล</span>
        </button>
      </div>

    </form>
  </div>

  <script>
    // เชื่อมต่อข้อมูลโดยใช้ SheetDB API URL ของคุณโดยเฉพาะ
   const SHEETDB_API_URL = 'https://sheetdb.io/api/v1/vfwf5hr934cc1'; 

    async function handleFormSubmit(event) {
      event.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      
      // ล็อคปุ่มกดขณะกำลังยิง API ส่งข้อมูล
      submitBtn.disabled = true;
      submitBtn.style.backgroundColor = '#005D72';
      submitBtn.style.boxShadow = 'none';
      submitBtn.innerHTML = `<span>กำลังบันทึกข้อมูล...</span>`;

      // แสตมป์วันเวลาปัจจุบัน (รูปแบบ: วัน/เดือน/ปี ชั่วโมง:นาที:วินาที)
      const now = new Date();
      const thaiTimestamp = now.toLocaleString('th-TH');

      // โครงสร้าง JSON ที่ผูกชื่อคีย์ตามคอลัมน์ของ Google Sheet ในระบบคุณ
      const payload = {
        data: [
          {
            "Timestamp": thaiTimestamp,
            "เลขห้อง": document.getElementById('roomNumber').value,
            "ชื่อ": document.getElementById('firstName').value,
            "นามสกุล": document.getElementById('lastName').value,
            "เบอร์โทรศัพท์มือถือ": document.getElementById('phoneNumber').value
          }
        ]
      };

      try {
        const response = await fetch(SHEETDB_API_URL, {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        // เมื่อบันทึกสำเร็จผ่านตัวกลาง SheetDB
        if (response.ok && result.created) {
          Swal.fire({
            icon: 'success',
            title: 'ลงทะเบียนสำเร็จ!',
            text: 'ระบบได้เพิ่มข้อมูลผู้เช่าเข้า Google Sheet เรียบร้อยแล้ว',
            confirmButtonColor: '#00738C'
          });
          
          // ล้างข้อมูลในฟอร์มเพื่อเตรียมกรอกรายต่อไป โดยสไตล์ UI ไม่กะพริบหรือเปลี่ยนรูปทรง
          document.getElementById('registrationForm').reset();
        } else {
          throw new Error('ไม่สามารถเพิ่มข้อมูลไปยังระบบได้สำเร็จ');
        }

      } catch (error) {
        Swal.fire({
          icon: 'error',
          title: 'เกิดข้อผิดพลาด',
          text: error.message,
          confirmButtonColor: '#00738C'
        });
      } finally {
        // คืนค่าปุ่มกด สไตล์ ขนาด และสีสันกลับมาที่ค่าเดิมตามภาพ
        submitBtn.disabled = false;
        submitBtn.style.backgroundColor = '#00738C';
        submitBtn.style.boxShadow = '0 4px 14px rgba(0, 115, 140, 0.25)';
        submitBtn.innerHTML = '<span>บันทึกข้อมูล</span>';
      }
    }
  </script>
</body>
</html>
