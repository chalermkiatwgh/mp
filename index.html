<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test LIFF User ID</title>
    <script src="https://line-scdn.net"></script>
</head>
<body>
    <h2>กำลังโหลดข้อมูล LINE User ID...</h2>

    <script>
        const LIFF_ID = "2011380429-uAx3x4YJ"; // ใส่ LIFF ID ของคุณ

        async function main() {
            try {
                await liff.init({ liffId: LIFF_ID });
                
                // ตรวจสอบการล็อกอิน
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    const userId = profile.userId;
                    
                    // แสดง Popup แจ้ง User ID
                    alert("LINE User ID ของคุณคือ:\n" + userId);
                    
                    // หรือแสดงบนหน้าจอ
                    document.querySelector('h2').innerText = "User ID: " + userId;
                }
            } catch (error) {
                alert("เกิดข้อผิดพลาดในการ initialize LIFF: " + error);
            }
        }

        main();
    </script>
</body>
</html>
