<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงทะเบียนผู้เช่าใหม่</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://tailwindcss.com"></script>
  <!-- SweetAlert2 CDN สำหรับหน้าต่างแจ้งเตือนสำเร็จ/ผิดพลาด -->
  <script src="https://jsdelivr.net"></script>
  <style>
    @import url('https://googleapis.com');
    
    body { 
      font-family: 'Sarabun', sans-serif; 
      background-color: #F0F8FF; /* สีพื้นหลังหลัก ฟ้าไอซ์บลูอ่อนมาก สบายตา */
      color: #1D2939; /* สีตัวอักษรหลัก น้ำเงินเข้มเกือบดำ ทำให้อ่านง่าย */
    }

    /* สีกรอบและ Placeholder ตามดีไซน์ฟ้าทะเล */
    .custom-input {
      background-color: #FFFFFF; /* สีกล่องข้อความสีขาวบริสุทธิ์ */
      border: 1px solid #87CEEB; /* สีกรอบสกายบลู */
      border-radius: 8px; /* ขอบมน 8px */
      color: #1D2939;
    }
    .custom-input::placeholder {
      color: #A3C1AD; /* สีข้อความแนะนำฟ้าซีฟอร์มซีด */
    }
    .custom-input:focus {
      outline: none;
      border-color: #007791;
      box-shadow: 0 0 0 2px rgba(0, 119, 145, 0.15);
    }

    /* สีปุ่มหลัก ฟ้าลึกน้ำทะเลลึก */
    .btn-primary {
      background-color: #007791;
      color: #FFFFFF;
      border-radius: 12px; /* ขอบมน 12px ตามข้อกำหนด */
    }
    .btn-primary:hover {
      background-color: #005A6F;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- Container ฟอร์มหลัก (บีบขนาดแบบ Mobile-First) -->
  <div class="w-full max-w-sm space-y-6 px-2">
    
    <!-- [ ส่วนหัวข้อ - Header ] -->
    <div class="text-center space-y-2">
      <div class="flex items-center justify-center space-x-2">
        <h2 class="text-2xl font-bold tracking-wide" style="color: #1D2939;">ลงทะเบียนผู้เช่าใหม่</h2>
        <span style="color: #007791;" class="text-2xl">🏢</span>
      </div>
    </div>

    <!-- [ ส่วนกรอกข้อมูล - Form Fields ] -->
    <form id="registrationForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
      
      <!-- หมายเลขห้อง (Room Number) -->
      <div class="flex flex-col space-y-1">
        <label for="roomNumber" class="text-base font-medium">เลขห้อง</label>
        <input type="text" id="roomNumber" name="roomNumber" required
          class="custom-input w-full px-4 py-2.5 text-base transition-all"
          placeholder="เช่น 101">
      </div>

      <!-- ชื่อ (First Name) -->
      <div class="flex flex-col space-y-1">
        <label for="firstName" class="text-base font-medium">ชื่อ</label>
        <input type="text" id="firstName" name="firstName" required
          class="custom-input w-full px-4 py-2.5 text-base transition-all"
          placeholder="กรอกชื่อจริง">
      </div>

      <!-- นามสกุล (Last Name) -->
      <div class="flex flex-col space-y-1">
        <label for="lastName" class="text-base font-medium">นามสกุล</label>
        <input type="text" id="lastName" name="lastName" required
          class="custom-input w-full px-4 py-2.5 text-base transition-all"
          placeholder="กรอกนามสกุล">
      </div>

      <!-- เบอร์มือถือ (Phone Number) -->
      <div class="flex flex-col space-y-1">
        <label for="phoneNumber" class="text-base font-medium">เบอร์โทรศัพท์มือถือ</label>
        <input type="tel" id="phoneNumber" name="phoneNumber" required pattern="[0-9]*" inputmode="numeric"
          oninput="this.value = this.value.replace(/[^0-9]/g, '')"
          class="custom-input w-full px-4 py-2.5 text-base transition-all"
          placeholder="กรอกเบอร์มือถือ 10 หลัก">
      </div>

      <!-- [ ส่วนปุ่มกด - Action Button ] -->
      <div class="pt-4">
        <button type="submit" id="submitBtn"
          class="btn-primary w-full font-bold py-3 px-4 shadow-md transition-all flex items-center justify-center space-x-2 text-lg">
          <span>บันทึกข้อมูล</span>
        </button>
      </div>

    </form>
  </div>

  <script>
    // ⚠️ อย่าลืมนำ URL API จากระบบ SheetDB มาใส่ที่นี่แทนข้อความเดิมครับ
    const SHEETDB_API_URL = 'https://sheetdb.io'; 

    // ฟังก์ชันจัดการบันทึกข้อมูลเมื่อมีการกด Submit ฟอร์ม
    async function handleFormSubmit(event) {
      event.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      
      // ล็อคปุ่มกดและเปลี่ยนสถานะเป็นกำลังบันทึกข้อมูลเพื่อป้องกันการกดเบิ้ล
      submitBtn.disabled = true;
      submitBtn.style.backgroundColor = '#005A6F';
      submitBtn.innerHTML = `<span>กำลังบันทึกข้อมูล...</span>`;

      // ดึงแสตมป์เวลา ณ ปัจจุบันในระบบเครื่องผู้ใช้
      const now = new Date();
      const thaiTimestamp = now.toLocaleString('th-TH');

      // การจัดกลุ่มโครงสร้าง Data เพื่อยิงเข้า API (สะกดคีย์ให้ตรงกับหัวคอลัมน์ใน Google Sheet)
      const payload = {
        data: [
          {
            timestamp: thaiTimestamp,
            roomNumber: document.getElementById('roomNumber').value,
            fullName: document.getElementById('firstName').value + ' ' + document.getElementById('lastName').value,
            phoneNumber: document.getElementById('phoneNumber').value
          }
        ]
      };

      try {
        // ส่ง Request แบบ POST ตรงเข้าสู่ระบบบริการเชื่อมต่อ Google Sheet API
        const response = await fetch(SHEETDB_API_URL, {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        // เช็คความสำเร็จ (ตัวแทน API จะตอบกลับในรูปแบบ object ที่มีตัวแปร created)
        if (response.ok && result.created) {
          Swal.fire({
            icon: 'success',
            title: 'ลงทะเบียนสำเร็จ!',
            text: 'ระบบได้บันทึกข้อมูลเข้า Google Sheet เรียบร้อยแล้ว',
            confirmButtonColor: '#007791'
          });
          
          // ทำการล้างฟิลด์กรอกข้อมูลทั้งหมดเมื่อกดบันทึกสำเร็จ
          document.getElementById('registrationForm').reset();
        } else {
          throw new Error('ไม่สามารถบันทึกข้อมูลได้สำเร็จตามระบบ');
        }

      } catch (error) {
        Swal.fire({
          icon: 'error',
          title: 'เกิดข้อผิดพลาด',
          text: 'เกิดข้อผิดพลาดระหว่างส่งข้อมูล: ' + error.message,
          confirmButtonColor: '#007791'
        });
      } finally {
        // คืนค่าปุ่มกดกลับมาในสภาพปกติให้สามารถกรอกข้อมูลรายต่อไปได้ต่อ
        submitBtn.disabled = false;
        submitBtn.style.backgroundColor = '#007791';
        submitBtn.innerHTML = '<span>บันทึกข้อมูล</span>';
      }
    }
  </script>
</body>
</html>
