<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงทะเบียนผู้เช่าใหม่</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://tailwindcss.com"></script>
  <!-- SweetAlert2 CDN สำหรับหน้าต่างแจ้งเตือน -->
  <script src="https://jsdelivr.net"></script>
  <style>
    @import url('https://googleapis.com');
    
    body { 
      font-family: 'Sarabun', sans-serif; 
      background-color: #F2F7FA; /* สีพื้นหลังหลักรอบนอก โทนฟ้าไอซ์บลูจางๆ ตามภาพ */
    }

    /* กล่องข้อความ (Input Field) ขอบมนบาง ลึกโค้งมนยาวสอดคล้องกับภาพ */
    .custom-input {
      background-color: #FFFFFF;
      border: 1px solid #D9E1E7; /* สีเส้นขอบเทาอ่อนนุ่มนวล ไม่เข้มเกินไป */
      border-radius: 14px; /* ขอบมนลึก 14px ตามสไตล์ในรูปภาพ */
      color: #1A2530;
      font-size: 16px;
      font-weight: 400;
    }
    .custom-input::placeholder {
      color: #B2BEC7; /* สีข้อความแนะนำจางลงตรงตามภาพ */
    }
    .custom-input:focus {
      outline: none;
      border-color: #007691;
      box-shadow: 0 0 0 3px rgba(0, 118, 145, 0.08);
    }

    /* ปุ่มบันทึกข้อมูลสีน้ำเงินเข้มลึกอมเขียว (Ocean Blue) ทรงแบนตัดขอบมน */
    .btn-primary {
      background-color: #007691; /* รหัสสีที่ถอดออกมาจากปุ่มจริงในรูปภาพ */
      color: #FFFFFF;
      border-radius: 16px; /* ขอบปุ่มโค้งมนลึก 16px สวยงาม */
    }
    .btn-primary:hover {
      background-color: #005F75;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- แผ่นการ์ดพื้นหลังสีขาวทรงสูง ขอบมนลึก และเงาฟุ้งเบาๆ โอบล้อมการ์ด -->
  <div class="w-full max-w-[390px] bg-white rounded-[32px] shadow-[0_15px_35px_rgba(0,119,145,0.05)] p-8 pt-12 pb-10 space-y-6">
    
    <!-- [ ส่วนหัวข้อ - Header ] -->
    <div class="text-center space-y-3">
      <!-- รูปไอคอนตึกสี่เหลี่ยมสีฟ้าแบบในภาพ -->
      <div class="flex justify-center mb-1">
        <svg xmlns="http://w3.org" viewBox="0 0 48 48" class="w-16 h-16">
          <path fill="#84B0DF" d="M36 42H12V14h24v28z"/>
          <path fill="#5486C2" d="M26 6h-4v8h4V6z"/>
          <path fill="#699BD3" d="M30 14H18V6h12v8z"/>
          <path fill="#5486C2" d="M12 14h24v4H12v-4z"/>
          <path fill="#A5C8ED" d="M16 20h4v4h-4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4zm-12 6h4v4h-4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4zm-12 6h4v4h-4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4zm-12 6h4v4h-4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4z"/>
        </svg>
      </div>
      <!-- ข้อความหัวข้อสีกรมท่าเข้ม ตัวหนาจัดวางกึ่งกลาง -->
      <h2 class="text-2xl font-bold text-[#1D2939] tracking-tight">ลงทะเบียนผู้เช่าใหม่</h2>
    </div>

    <!-- [ ส่วนกรอกข้อมูล - Form Fields ] -->
    <form id="registrationForm" onsubmit="handleFormSubmit(event)" class="space-y-[18px]">
      
      <!-- เลขห้อง -->
      <div class="flex flex-col space-y-1.5">
        <label for="roomNumber" class="text-[15px] font-medium text-[#1D2939]">เลขห้อง</label>
        <input type="text" id="roomNumber" name="roomNumber" required
          class="custom-input w-full px-4 py-[13px] transition-all"
          placeholder="เช่น 101">
      </div>

      <!-- ชื่อ -->
      <div class="flex flex-col space-y-1.5">
        <label for="firstName" class="text-[15px] font-medium text-[#1D2939]">ชื่อ</label>
        <input type="text" id="firstName" name="firstName" required
          class="custom-input w-full px-4 py-[13px] transition-all"
          placeholder="กรอกชื่อจริง">
      </div>

      <!-- นามสกุล -->
      <div class="flex flex-col space-y-1.5">
        <label for="lastName" class="text-[15px] font-medium text-[#1D2939]">นามสกุล</label>
        <input type="text" id="lastName" name="lastName" required
          class="custom-input w-full px-4 py-[13px] transition-all"
          placeholder="กรอกนามสกุล">
      </div>

      <!-- เบอร์โทรศัพท์มือถือ -->
      <div class="flex flex-col space-y-1.5">
        <label for="phoneNumber" class="text-[15px] font-medium text-[#1D2939]">เบอร์โทรศัพท์มือถือ</label>
        <input type="tel" id="phoneNumber" name="phoneNumber" required pattern="[0-9]*" inputmode="numeric"
          oninput="this.value = this.value.replace(/[^0-9]/g, '')"
          class="custom-input w-full px-4 py-[13px] transition-all"
          placeholder="กรอกเบอร์มือถือ 10 หลัก">
      </div>

      <!-- [ ส่วนปุ่มกด - Action Button ] -->
      <div class="pt-4">
        <button type="submit" id="submitBtn"
          class="btn-primary w-full font-bold py-4 text-[17px] transition-all flex items-center justify-center space-x-2 shadow-[0_4px_12px_rgba(0,118,145,0.2)]">
          <span>บันทึกข้อมูล</span>
        </button>
      </div>

    </form>
  </div>

  <script>
    // เชื่อมโยงกับ Google Sheet ผ่าน SheetDB API ของคุณตามเดิม
    const SHEETDB_API_URL = 'https://sheetdb.io'; 

    async function handleFormSubmit(event) {
      event.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      
      // ล็อคปุ่มขณะบันทึกข้อมูลเพื่อความปลอดภัย
      submitBtn.disabled = true;
      submitBtn.style.backgroundColor = '#005F75';
      submitBtn.innerHTML = `<span>กำลังบันทึกข้อมูล...</span>`;

      const now = new Date();
      const thaiTimestamp = now.toLocaleString('th-TH');

      const payload = {
        data: [
          {
            "Timestamp": thaiTimestamp,
            "เลขห้อง": document.getElementById('roomNumber').value,
            "ชื่อ": document.getElementById('firstName').value,
            "นามสกุล": document.getElementById('lastName').value,
            "เบอร์โทรศัพท์มือถือ": document.getElementById('phoneNumber').value
          }
        ]
      };

      try {
        const response = await fetch(SHEETDB_API_URL, {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (response.ok && result.created) {
          Swal.fire({
            icon: 'success',
            title: 'ลงทะเบียนสำเร็จ!',
            text: 'ระบบได้เพิ่มข้อมูลผู้เช่าเข้า Google Sheet เรียบร้อยแล้ว',
            confirmButtonColor: '#007691'
          });
          
          document.getElementById('registrationForm').reset();
        } else {
          throw new Error('ไม่สามารถเพิ่มข้อมูลไปยังระบบได้สำเร็จ');
        }

      } catch (error) {
        Swal.fire({
          icon: 'error',
          title: 'เกิดข้อผิดพลาด',
          text: error.message,
          confirmButtonColor: '#007691'
        });
      } finally {
        // คืนสภาพปุ่มกดปกติ
        submitBtn.disabled = false;
        submitBtn.style.backgroundColor = '#007691';
        submitBtn.innerHTML = '<span>บันทึกข้อมูล</span>';
      }
    }
  </script>
</body>
</html>
