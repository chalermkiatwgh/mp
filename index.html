<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE LIFF - Room Registration (SheetDB)</title>
    <!-- Include LINE SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            padding: 20px 0;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            padding: 24px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 340px;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }
        input[type="text"], input[type="tel"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[readonly] {
            background-color: #e9ecef;
            color: #495057;
        }
        button {
            background-color: #06C755;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #05b04b;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #status-message {
            margin-top: 12px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>ลงทะเบียนห้องพัก</h2>
        
        <form id="registrationForm">
            <div class="form-group">
                <label for="lineUserId">LINE User ID</label>
                <input type="text" id="lineUserId" readonly placeholder="กำลังโหลดโปรไฟล์ LINE...">
            </div>
            
            <div class="form-group">
                <label for="roomNumber">หมายเลขห้อง</label>
                <input type="text" id="roomNumber" required placeholder="เช่น 401, 12B">
            </div>

            <div class="form-group">
                <label for="firstName">ชื่อจริง</label>
                <input type="text" id="firstName" required placeholder="กรอกชื่อจริง">
            </div>

            <div class="form-group">
                <label for="lastName">นามสกุล</label>
                <input type="text" id="lastName" required placeholder="กรอกนามสกุล">
            </div>

            <div class="form-group">
                <label for="phoneNumber">เบอร์โทรศัพท์</label>
                <input type="tel" id="phoneNumber" required pattern="[0-9]{9,10}" placeholder="เช่น 0812345678">
            </div>
            
            <button type="submit" id="btn-submit" disabled>ส่งข้อมูลลงทะเบียน</button>
        </form>
        
        <div id="status-message" style="color: #666;">กำลังเริ่มต้นระบบ LIFF...</div>
    </div>

    <script>
        const MY_LIFF_ID = '2011380429-uAx3x4YJ'; 
        
        // วาง URL API ของ SheetDB ของคุณที่นี่
        // const SHEETDB_API_URL = 'YOUR_SHEETDB_API_URL';
   const SHEETDB_API_URL = 'https://sheetdb.io/api/v1/vfwf5hr934cc1'; 

        const statusMessage = document.getElementById('status-message');
        const lineUserIdInput = document.getElementById('lineUserId');
        const submitButton = document.getElementById('btn-submit');
        const registrationForm = document.getElementById('registrationForm');

        async function initLIFF() {
            try {
                await liff.init({ liffId: MY_LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    lineUserIdInput.value = profile.userId;
                    statusMessage.textContent = 'เชื่อมต่อ LINE สำเร็จ';
                    statusMessage.style.color = 'green';
                    submitButton.disabled = false;
                }
            } catch (error) {
                console.error('LIFF Initialization failed', error);
                statusMessage.textContent = 'ไม่สามารถโหลดโปรไฟล์ LINE ได้';
                statusMessage.style.color = 'red';
            }
        }

        registrationForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const roomNum = document.getElementById('roomNumber').value.trim();
            const fName = document.getElementById('firstName').value.trim();
            const lName = document.getElementById('lastName').value.trim();
            const phone = document.getElementById('phoneNumber').value.trim();
            const userId = lineUserIdInput.value;

            if (!userId) {
                alert('ไม่พบข้อมูล LINE Profile กรุณารีเฟรชหน้าจอ');
                return;
            }

            statusMessage.textContent = 'กำลังส่งข้อมูล...';
            statusMessage.style.color = '#333';
            submitButton.disabled = true;

            try {
                // ส่งข้อมูลไปยัง SheetDB โดยระบุชื่อคอลัมน์ให้ตรงกับบน Google Sheets
                const response = await fetch(SHEETDB_API_URL, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        data: [
                            {
                                'lineId': userId,
                                'roomNumber': roomNum,
                                'firstName': fName,
                                'lastName': lName,
                                'phoneNumber': phone
                            }
                        ]
                    })
                });

                const data = await response.json();

                if (data.created && data.created > 0) {
                    statusMessage.textContent = 'ลงทะเบียนข้อมูลสำเร็จแล้ว!';
                    statusMessage.style.color = 'green';
                    
                    // เคลียร์ค่าในฟอร์มหลังจากส่งเสร็จ (ยกเว้น LINE ID)
                    document.getElementById('roomNumber').value = '';
                    document.getElementById('firstName').value = '';
                    document.getElementById('lastName').value = '';
                    document.getElementById('phoneNumber').value = '';
                } else {
                    throw new Error(data.error || 'ไม่สามารถเพิ่มข้อมูลลงใน Google Sheets ได้');
                }
            } catch (error) {
                console.error(error);
                statusMessage.textContent = 'เกิดข้อผิดพลาด: ' + error.message;
                statusMessage.style.color = 'red';
            } finally {
                submitButton.disabled = false;
            }
        });

        initLIFF();
    </script>
</body>
</html>
