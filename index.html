<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงทะเบียนผู้เช่าใหม่</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://tailwindcss.com"></script>
  <!-- SweetAlert2 CDN สำหรับหน้าต่างแจ้งเตือน -->
  <script src="https://jsdelivr.net"></script>
  <style>
    @import url('https://googleapis.com');
    
    body { 
      font-family: 'Sarabun', sans-serif; 
      background-color: #F4F8FA; /* สีพื้นหลังหลักภายนอกฟ้าอ่อนแบบในภาพ */
    }

    /* ตกแต่ง Input Field ให้ตรงตามภาพเป๊ะๆ */
    .custom-input {
      background-color: #FFFFFF;
      border: 1px solid #E5E9EB; /* สีเส้นขอบเทาอ่อนจาง */
      border-radius: 12px; /* ขอบมน 12px ตามรูปทรงในภาพ */
      color: #1D2939;
      font-size: 15px;
    }
    .custom-input::placeholder {
      color: #BAC2C7; /* สีของตัวอักษร Placeholder จางๆ */
    }
    .custom-input:focus {
      outline: none;
      border-color: #007791;
      box-shadow: 0 0 0 2px rgba(0, 119, 145, 0.1);
    }

    /* ปุ่มบันทึกข้อมูลทรงมนลึกสีน้ำเงินอมเขียว (Teal/Ocean Blue) */
    .btn-primary {
      background-color: #047896; /* เฉดสีน้ำเงินอมเขียวตรงตามรูปภาพ */
      color: #FFFFFF;
      border-radius: 16px; /* ขอบปุ่มมนลึกกว่ากล่องข้อความ */
    }
    .btn-primary:hover {
      background-color: #035F77;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-5">

  <!-- แผ่นการ์ดพื้นหลังสีขาว ขอบมน และมีเงาฟุ้งนุ่มๆ (ตามภาพ) -->
  <div class="w-full max-w-[390px] bg-white rounded-[32px] shadow-[0_10px_30px_rgba(0,119,145,0.06)] px-8 py-10 space-y-8">
    
    <!-- [ ส่วนหัวข้อ - Header ] -->
    <div class="text-center space-y-4">
      <!-- ไอคอนรูปตึก 3 มิติโทนฟ้า -->
      <div class="flex justify-center">
        <img src="https://icons8.com" alt="building" class="w-16 h-16">
      </div>
      <!-- ข้อความหัวข้อตัวหนาสีกรมท่าเข้ม -->
      <h2 class="text-[22px] font-bold tracking-wide text-[#1A2530]">ลงทะเบียนผู้เช่าใหม่</h2>
    </div>

    <!-- [ ส่วนกรอกข้อมูล - Form Fields ] -->
    <form id="registrationForm" onsubmit="handleFormSubmit(event)" class="space-y-[18px]">
      
      <!-- เลขห้อง -->
      <div class="flex flex-col space-y-2">
        <label for="roomNumber" class="text-xs font-semibold text-[#5A6E7F] tracking-wide">เลขห้อง</label>
        <input type="text" id="roomNumber" name="roomNumber" required
          class="custom-input w-full px-4 py-3.5 transition-all"
          placeholder="เช่น 101">
      </div>

      <!-- ชื่อ -->
      <div class="flex flex-col space-y-2">
        <label for="firstName" class="text-xs font-semibold text-[#5A6E7F] tracking-wide">ชื่อ</label>
        <input type="text" id="firstName" name="firstName" required
          class="custom-input w-full px-4 py-3.5 transition-all"
          placeholder="กรอกชื่อจริง">
      </div>

      <!-- นามสกุล -->
      <div class="flex flex-col space-y-2">
        <label for="lastName" class="text-xs font-semibold text-[#5A6E7F] tracking-wide">นามสกุล</label>
        <input type="text" id="lastName" name="lastName" required
          class="custom-input w-full px-4 py-3.5 transition-all"
          placeholder="กรอกนามสกุล">
      </div>

      <!-- เบอร์โทรศัพท์มือถือ -->
      <div class="flex flex-col space-y-2">
        <label for="phoneNumber" class="text-xs font-semibold text-[#5A6E7F] tracking-wide">เบอร์โทรศัพท์มือถือ</label>
        <input type="tel" id="phoneNumber" name="phoneNumber" required pattern="[0-9]*" inputmode="numeric"
          oninput="this.value = this.value.replace(/[^0-9]/g, '')"
          class="custom-input w-full px-4 py-3.5 transition-all"
          placeholder="กรอกเบอร์มือถือ 10 หลัก">
      </div>

      <!-- [ ส่วนปุ่มกด - Action Button ] -->
      <div class="pt-4">
        <button type="submit" id="submitBtn"
          class="btn-primary w-full font-bold py-4 text-base transition-all flex items-center justify-center space-x-2">
          <span>บันทึกข้อมูล</span>
        </button>
      </div>

    </form>
  </div>

  <script>
    // คงค่า URL API ของคุณไว้ตามเดิม
    const SHEETDB_API_URL = 'https://sheetdb.io/api/v1/vfwf5hr934cc1'; 

    async function handleFormSubmit(event) {
      event.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      
      // ล็อคปุ่มขณะประมวลผล
      submitBtn.disabled = true;
      submitBtn.style.backgroundColor = '#035F77';
      submitBtn.innerHTML = `<span>กำลังบันทึกข้อมูล...</span>`;

      const now = new Date();
      const thaiTimestamp = now.toLocaleString('th-TH');

      // จัดระเบียบคีย์ส่งข้อมูลเข้า Google Sheet ตามลำดับคอลัมน์ของคุณ
      const payload = {
        data: [
          {
            "Timestamp": thaiTimestamp,
            "เลขห้อง": document.getElementById('roomNumber').value,
            "ชื่อ": document.getElementById('firstName').value,
            "นามสกุล": document.getElementById('lastName').value,
            "เบอร์โทรศัพท์มือถือ": document.getElementById('phoneNumber').value
          }
        ]
      };

      try {
        const response = await fetch(SHEETDB_API_URL, {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (response.ok && result.created) {
          Swal.fire({
            icon: 'success',
            title: 'ลงทะเบียนสำเร็จ!',
            text: 'ระบบได้เพิ่มข้อมูลผู้เช่าเข้า Google Sheet เรียบร้อยแล้ว',
            confirmButtonColor: '#047896'
          });
          
          document.getElementById('registrationForm').reset();
        } else {
          throw new Error('ไม่สามารถเพิ่มข้อมูลไปยังระบบได้สำเร็จ');
        }

      } catch (error) {
        Swal.fire({
          icon: 'error',
          title: 'เกิดข้อผิดพลาด',
          text: error.message,
          confirmButtonColor: '#047896'
        });
      } finaly {
        // คืนสภาพปุ่มกด
        submitBtn.disabled = false;
        submitBtn.style.backgroundColor = '#047896';
        submitBtn.innerHTML = '<span>บันทึกข้อมูล</span>';
      }
    }
  </script>
</body>
</html>
