<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนผู้เช่า</title>
    <!-- โหลด LINE LIFF SDK -->
    <script src="https://line-scdn.net"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #06C755; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>📝 ลงทะเบียนผู้เช่าใหม่</h2>
    <form id="regForm">
        <div class="form-group">
            <label>เบอร์ห้อง:</label>
            <input type="text" id="roomNumber" required>
        </div>
        <div class="form-group">
            <label>ชื่อ:</label>
            <input type="text" id="firstName" required>
        </div>
        <div class="form-group">
            <label>นามสกุล:</label>
            <input type="text" id="lastName" required>
        </div>
        <div class="form-group">
            <label>เบอร์โทรศัพท์:</label>
            <input type="tel" id="phoneNumber" required>
        </div>
        <!-- เก็บ LINE ID แบบซ่อนไว้ -->
        <input type="hidden" id="lineId">

        <button type="submit">ส่งข้อมูลลงทะเบียน</button>
    </form>

    <script>
        const LIFF_ID = 'YOUR_LIFF_ID'; // นำ LIFF ID จาก LINE Developer มาใส่ตรงนี้
        const BACKEND_URL = 'YOUR_WEB_APP_URL'; // นำ Web App URL จาก Google Sheets มาใส่ตรงนี้

        async function initLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login(); // บังคับให้ล็อกอินเข้า LINE
                } else {
                    const profile = await liff.getProfile();
                    document.getElementById('lineId').value = profile.userId; // ดึง LINE User ID อัตโนมัติ
                }
            } catch (error) {
                console.error('LIFF Initialization failed', error);
            }
        }

        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                roomNumber: document.getElementById('roomNumber').value,
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                phoneNumber: document.getElementById('phoneNumber').value,
                lineId: document.getElementById('lineId').value
            };

            // ส่งข้อมูลไปยัง Google Sheets via Apps Script
            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if(result.status === 'success') {
                    alert('ลงทะเบียนสำเร็จแล้วครับ!');
                    liff.closeWindow(); // ปิดหน้าต่าง LIFF ทันทีเมื่อเสร็จ
                } else {
                    alert('เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
                }
            } catch (err) {
                alert('ส่งข้อมูลไม่สำเร็จ: ' + err);
            }
        });

        initLiff();
    </script>
</body>
</html>
